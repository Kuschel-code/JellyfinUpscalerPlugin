name: Build Plugin (CI)

# Note: Auto-release on tag push was removed after v1.6.1.11 / v1.6.1.12 shipped
# corrupt ZIPs. CI packaged `./publish/*` unfiltered (including .pdb, .deps.json,
# test-coverage DLLs from `dotnet test`) and clobbered the hand-curated 6-file
# plugin ZIP via softprops/action-gh-release. Releases are now always cut
# manually: `gh release create vX.Y.Z release-stage-X.Y.Z.zip`, then
# `pwsh Scripts/verify-release.ps1` to SHA-round-trip-validate. Keeping CI here
# for build + test verification only.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Restore dependencies
        run: dotnet restore JellyfinUpscalerPlugin.Tests/JellyfinUpscalerPlugin.Tests.csproj
        
      - name: Build plugin
        run: dotnet build JellyfinUpscalerPlugin.csproj --configuration Release --no-restore

      - name: Run C# tests
        run: dotnet test JellyfinUpscalerPlugin.Tests/JellyfinUpscalerPlugin.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=csharp.trx" --results-directory TestResults

      - name: Upload C# test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csharp-trx
          path: TestResults/csharp.trx
          if-no-files-found: error

      - name: Validate C# test results
        if: always()
        run: python3 Scripts/assert-test-results.py TestResults/csharp.trx

      - name: Validate the TRX validator
        run: python3 -m unittest discover -s tests -p test_ci_test_results.py -v

      - name: Run player behavior tests
        run: node --test tests/*.test.cjs

      - name: Publish plugin
        run: dotnet publish JellyfinUpscalerPlugin.csproj --configuration Release --no-build --output ./publish
        
      - name: Create plugin archive
        run: |
          VERSION=$(grep -oP '<AssemblyVersion>\K[^<]+' JellyfinUpscalerPlugin.csproj | head -1)
          python3 Scripts/package-plugin.py publish "JellyfinUpscalerPlugin-v${VERSION}.zip"
          echo "PLUGIN_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=JellyfinUpscalerPlugin-v${VERSION}.zip" >> $GITHUB_ENV
          
      - name: Calculate SHA-256 checksum
        id: checksum
        run: |
          CHECKSUM=$(sha256sum "${ARCHIVE_NAME}" | awk '{print $1}')
          echo "Calculated SHA-256: ${CHECKSUM}"
          echo "(CI-built ZIP is intentionally NOT published. See workflow header for rationale.)"
